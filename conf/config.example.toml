[log]
# valid levels are "debug", "info", "warn", "error"
level = "info"
# valid formats are "text" and "json"
format = "text"
# whether to add the log source to the log message
add_source = true

# Replace <botname> with the actual bot name (e.g. [bot.hue])
[bot.<botname>]
application_id = 0
# Only required when running with --oauth2
base_url = ""
